[package]
name = "telegram-client"
version = "1.8.70"
authors = ["fewensa <fewensa@protonmail.com>"]
description = "Telegram client bindings for TDLib"
homepage = "https://github.com/fewensa/telegram-client"
repository = "https://github.com/fewensa/telegram-client"
license = "MIT"
keywords = ["tdlib", "telegram", "telegram-client", "bindings", "async"]
categories = ["api-bindings"]
include = [
  "Cargo.toml",
  "**/*.rs",
  "README.md",
  "LICENSE",
  "version.md",
  "CHANGELOG.md",
]
readme = "README.md"
edition = "2021"
rust-version = "1.89"

build = "build.rs"

[dependencies]
rtdlib = { version = "=1.8.70", features = [ "sys" ] }
#rtdlib = { path = "../rtdlib", features = [ "sys" ] }

log = "0.4.35"
regex = "1.13.1"
futures = "0.3.34"

[dev-dependencies]
colored = "3.1.1"
hostname = "0.4.2"
toml = "1.2.0"

simple_logger = "5.2.0"

toolkit = "0.1.1"

tokio = { version = "1.54.1", features = ["full"] }
