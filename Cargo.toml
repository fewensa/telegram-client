[package]
name = "telegram-client"
version = "1.8.69"
authors = ["fewensa <fewensa@protonmail.com>"]
description = "Telegram client bindings for TDLib"
homepage = "https://github.com/fewensa/telegram-client"
repository = "https://github.com/fewensa/telegram-client"
license = "MIT"
keywords = ["tdlib", "telegram", "telegram-client", "bindings", "async"]
categories = ["api-bindings"]
include = [
  "Cargo.toml",
  "**/*.rs",
  "README.md",
  "LICENSE",
  "version.md",
  "CHANGELOG.md",
]
readme = "README.md"
edition = "2021"
rust-version = "1.89"

build = "build.rs"

[dependencies]
rtdlib = { version = "=1.8.69", features = [ "sys" ] }
#rtdlib = { path = "../rtdlib", features = [ "sys" ] }

log = "0.4"
regex = "1"
futures = "0.3"

[dev-dependencies]
colored = "3"
hostname = "0.4"
toml = "0.8"

simple_logger = "5"

toolkit = "0.1"

tokio = { version = "1", features = ["full"] }
